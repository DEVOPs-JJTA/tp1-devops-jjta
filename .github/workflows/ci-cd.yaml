name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Dependencies
        working-directory: ./api
        run: npm ci
      - name: Run Tests
        working-directory: ./api
        run: npm test
      - name: Install Web Dependencies
        working-directory: ./app-web
        run: npm ci
      - name: Lint Web
        working-directory: ./app-web
        run: npm run lint
      - name: Build Web
        working-directory: ./app-web
        run: npm run build

  trivy:
    name: Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  sast:
    name: SAST (Codacy)
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Codacy Analysis CLI
        run: npm install --global @codacy/analysis-cli@0.23.1
      - name: Load Codacy configuration
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -z "$CODACY_PROJECT_TOKEN" ]; then
            echo "::error::Configure the CODACY_PROJECT_TOKEN repository secret."
            exit 1
          fi
          codacy-analysis init --remote gh "${GITHUB_REPOSITORY%%/*}" "${GITHUB_REPOSITORY#*/}"
      - name: Analyze code
        run: |
          codacy-analysis analyze --install-dependencies --no-log \
            --output-format sarif --output results.sarif
      - name: Upload results to Codacy
        # Upload findings even when analysis fails, without hiding the failure.
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: codacy-analysis upload results.sarif

  build-and-push:
    name: Build & Push to Docker Hub
    needs: [test, trivy, sast]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push API
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./api
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tp1-devops-api:latest

      - name: Build and Push Web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./app-web
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tp1-devops-app-web:latest

      - name: Build y Push del Proxy Reverso
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./proxy
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tp1-devops-proxy:latest